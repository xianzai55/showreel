<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kexin Hu — Digital Art Portfolio</title>
  <script>
    // SPA fallback for GitHub Pages subpath deployment
    const base = '/showreel';
    const fullPath = window.location.pathname + (window.location.search || '') + (window.location.hash || '');
    const routePath = fullPath.replace(base, '') || '/';
    sessionStorage.setItem('spa-route', routePath);
    window.location.replace(base + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
