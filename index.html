<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="数字艺术 / 新媒体艺术作品集 — 东方数字诗意 × 沉浸式未来美术馆" />
    <title>Kexin Hu — 数字艺术作品集</title>
    <script>
      // Restore SPA route after GitHub Pages 404 fallback redirect
      (function () {
        const route = sessionStorage.getItem('spa-route')
        if (route) {
          sessionStorage.removeItem('spa-route')
          if (route !== '/' && route !== window.location.pathname.replace('/showreel', '')) {
            window.history.replaceState(null, '', '/showreel' + route)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
